<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Without this a phone browser lays the page out at 980px and then shrinks
      it, which is why everything arrived tiny. viewport-fit=cover lets the
      bottom bar sit under the home indicator rather than above it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16161a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ren&rsquo;Py Writer" />
    <title>Ren'Py Writer</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
