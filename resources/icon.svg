<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Ren'Py Writer: a line of dialogue being written. A speech bubble in the
    app's accent violet, holding three script lines whose dots are speaker
    colours, as the Writer view shows them; its tail is a pen nib.

    Layers carry ids so scripts/icons.mjs can draw the background and the
    foreground separately, as Android's adaptive icons need.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2547"/>
      <stop offset="1" stop-color="#121118"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d8fff"/>
      <stop offset="1" stop-color="#5440d8"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffd877"/>
      <stop offset="1" stop-color="#e0902c"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g id="background">
    <rect width="1024" height="1024" fill="url(#ground)"/>
  </g>

  <g id="foreground" filter="url(#lift)">
    <!-- The nib, as the bubble's tail: drawn first, so the bubble overlaps its base. -->
    <path d="M 300 548 L 486 600 L 334 806 Z" fill="url(#nib)"/>
    <path d="M 334 806 L 392 690" stroke="#3a2a10" stroke-width="12" stroke-linecap="round"/>
    <circle cx="400" cy="672" r="19" fill="#3a2a10"/>

    <rect x="262" y="250" width="520" height="372" rx="124" fill="url(#bubble)"/>

    <!-- Three lines of script, each with its speaker's colour. -->
    <circle cx="350" cy="352" r="24" fill="#6cc6ff"/>
    <rect x="394" y="334" width="268" height="36" rx="18" fill="#ffffff" fill-opacity="0.94"/>
    <circle cx="350" cy="436" r="24" fill="#ff8fbf"/>
    <rect x="394" y="418" width="320" height="36" rx="18" fill="#ffffff" fill-opacity="0.94"/>
    <circle cx="350" cy="520" r="24" fill="#7fe3a3"/>
    <rect x="394" y="502" width="214" height="36" rx="18" fill="#ffffff" fill-opacity="0.94"/>
  </g>
</svg>
