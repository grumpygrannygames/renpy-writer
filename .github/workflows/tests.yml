# Runs the checks that would otherwise only ever run on the author's machine.
#
# Two jobs, because they answer different questions and fail for different
# reasons. The first is quick and says whether the code is sound. The second
# starts the real application, drives it the way a person would, and says
# whether it still works -- which is slower and needs a desktop to draw on.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push while the first is still running makes the first irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  units:
    name: Types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Nothing here starts a window, so there is no reason to fetch the
      # hundred megabytes of Electron that would run one.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  app:
    name: The application itself
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Builds the app, then opens it in a real window and works through it.
      - name: End-to-end
        run: npm run test:e2e
